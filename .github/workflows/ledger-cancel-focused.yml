name: Publish retained cancellation source
on:
  push:
    branches: [validation/ledger-cancel-20261004]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 093bec9f6e09e4d40e0a55035d2941b5fe42edee
          path: subject
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: ledger-cancel-postgresql-20261004
          run-id: 37191663604
          github-token: ${{ github.token }}
          path: retained
      - name: Publish exact retained source, without rerunning tests
        working-directory: subject
        run: |
          python ../controller/publish-retained.py
          git config user.name woahwhattheheck
          git config user.email brycembusiness2@gmail.com
          git add backend/src/services/ledger.ts backend/tests/ledger.spec.ts backend/prisma/schema.prisma docs/LEDGER_CANCELLATION.md
          git commit -m 'fix(ledger): make cancellation conditional on pending state [skip ci]'
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git push origin HEAD:refs/heads/validation/ledger-cancel-candidate-20261004
