name: VQ217 locale compatibility

on:
  push:
    branches:
      - validation/vq217-locale-sol56-20261004

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Build App Router bundle
        run: pnpm run build
